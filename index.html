<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12100e" />
    <title>AL.F.S 프라이빗 쇼룸 | AL.F.S Private Showroom</title>
    <meta
      name="description"
      content="알프스(AL.F.S)의 프라이빗 3D 쇼룸. 오륜미네랄 1,000ml와 하루 1.3핏·클린바이옴을 아틀리에 공간에서 살펴보고, 대리점·총판 B2B 견적 상담으로 이어집니다."
    />
    <meta property="og:title" content="AL.F.S PRIVATE SHOWROOM" />
    <meta property="og:description" content="웰니스 아틀리에에서 만나는 오륜미네랄과 하루 1.3핏 · 클린바이옴" />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2312100e'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='26' font-weight='400' fill='%23c2a06a' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
    <script>
      // 화면 검증용 오류 수집 훅
      window.__SHOWROOM_ERRORS__ = [];
      window.__SHOWROOM_READY__ = false;
      window.addEventListener('error', function (e) {
        window.__SHOWROOM_ERRORS__.push('error: ' + (e.message || String(e.error)));
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__SHOWROOM_ERRORS__.push('unhandledrejection: ' + String(e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      (function () {
        var orig = console.error;
        console.error = function () {
          try {
            var parts = [];
            for (var i = 0; i < arguments.length; i += 1) {
              var a = arguments[i];
              parts.push(a && a.message ? a.message : String(a));
            }
            window.__SHOWROOM_ERRORS__.push('console.error: ' + parts.join(' '));
          } catch (err) {}
          return orig.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="stage" aria-hidden="true"></div>
      <div id="ui"></div>
      <div id="boot">
        <div class="boot-mark">A L . F . S</div>
        <div class="boot-line"><span></span></div>
        <div class="boot-note">쇼룸의 조명을 켜고 있습니다</div>
      </div>
      <noscript>
        <div class="noscript">이 쇼룸은 3D 화면으로 보여 드립니다. 자바스크립트를 켜 주세요.</div>
      </noscript>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
