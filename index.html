<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8eef2" />
    <title>알프스 3D 쇼룸 | AL.F.S Showroom</title>
    <meta
      name="description"
      content="알프스(AL.F.S)의 3D 가상 쇼룸. 오륜미네랄과 효소세상 6종을 3D 공간에서 살펴보고, 상담 직원에게 묻고, alfs.kr 주문으로 이어집니다."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ctext x='32' y='42' font-family='system-ui' font-size='22' font-weight='800' fill='%235eead4' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
    <script>
      // 실행 중 오류를 화면 검증용으로 모아 둡니다 (콘솔 확인용 진단 훅)
      window.__SHOWROOM_ERRORS__ = []
      window.addEventListener('error', function (e) {
        window.__SHOWROOM_ERRORS__.push('error: ' + (e.message || String(e.error)))
      })
      window.addEventListener('unhandledrejection', function (e) {
        window.__SHOWROOM_ERRORS__.push('unhandledrejection: ' + String(e.reason))
      })
      ;(function () {
        var orig = console.error
        console.error = function () {
          try {
            var parts = []
            for (var i = 0; i < arguments.length; i += 1) {
              var a = arguments[i]
              parts.push(a && a.message ? a.message : String(a))
            }
            window.__SHOWROOM_ERRORS__.push('console.error: ' + parts.join(' '))
          } catch (err) {}
          return orig.apply(console, arguments)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
